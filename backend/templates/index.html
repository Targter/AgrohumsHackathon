<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fertilizer Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <style>
    h1 {
        color: mediumseagreen;
        text-align: center;
    }

    .warning {
        color: red;
        font-weight: bold;
        text-align: center;
    }
    .card{
    margin-left:410px;
    margin-top: 20px;
    color: green;
    }
    .container{
    background:#acd8a7;
    font-weight: bold;
    padding-bottom:10px;
    border-radius: 15px;
    }
</style>

<body style="background:#BCBBB8">
  <body>
    <div class="container my-3 mt-3">
    <div class="Container">
        <h1 class="text-success" style="text-align: center">Fertilizer Recommendation System <span class="text-success"></span></h1>

<!--      adding form-->      
      <form action="/predict"  method="POST">
        <div class="row">
            <div class="col-md-4">
                <label for ="Temparature ">Temparature </label>
                <input type="number" id="Temparature" name="Temparature" placeholder="Enter Temperature in °C" class="form-control" required step="0">
            </div>
            <div class="col-md-4">
                <label for ="Humidity">Humidity</label>
                <input type="number" step="0.01" id="Humidity" name="Humidity" placeholder="Enter Humidity in %" class="form-control" required step="0">
            </div>
            <div class="col-md-4">
                <label for ="Moisture ">Moisture </label>
                <input type="number"  id="Moisture" name="Moisture" placeholder="Enter Moisture Value" class="form-control" required step="0">
            </div>
        </div>
        <div class="row">
            <div class="col-md-4">
                <label for="Soil_Type">Soil Type</label>
                <select id="Soil_Type" name="Soil_Type" class="form-control" required>
                    <option value="">Select Soil Type</option>
                    <option value="loamy">Loamy</option>
                    <option value="sandy">Sandy</option>
                    <option value="clayey">Clayey</option>
                    <option value="black">Black</option>
                    <option value="red">Red</option>
                </select>
            </div>
            
            <div class="col-md-4">
                <label for="Crop_Type">Crop Type</label>
                <select id="Crop_Type" name="Crop_Type" class="form-control" required>
                    <option value="">Select Crop Type</option>
                    <option value="sugarcane">Sugarcane</option>
                    <option value="cotton">Cotton</option>
                    <option value="millets">Millets</option>
                    <option value="paddy">Paddy</option>
                    <option value="pulses">Pulses</option>
                    <option value="wheat">Wheat</option>
                    <option value="tobacco">Tobacco</option>
                    <option value="barley">Barley</option>
                    <option value="oil_seeds">Oil Seeds</option>
                    <option value="ground_nuts">Ground Nuts</option>
                    <option value="maize">Maize</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for ="Nitrogen">Nitrogen </label>
                <input type="number" id="Nitrogen" name="Nitrogen" placeholder="Enter the Nitrogen Value" class="form-control" required step="0">
            </div>
        </div>
        <div class="row">
            <div class="col-md-4">
                <label for ="Potassium">Potassium </label>
                <input type="number" id="Potassium" name="Potassium" placeholder="Enter Potassium Value" class="form-control" required step="0">
            </div>
            <div class="col-md-4">
                <label for ="Phosphorous">Phosphorous</label>
                <input type="number" step="0.01" id="Phosphorous" name="Phosphorous" placeholder="Enter Phosphorous value" class="form-control" required step="0">
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-12 text-center">
                <button type="submit" class="btn btn-primary btn-lg">SUBMIT</button>
            </div>
        </div>


      </form>

      {% if result %}
      <div class="card bg-dark" style="width:18rem;">
        <img src="{{url_for('static',filename='img.jpg')}}" class="card-img-top" alt="...">
        <div class ="card-body">
            <h5 class="card-title" style="color: white;">Recommend Fertilizer is</h5>
            <p class="card-text"style="color:white;">{{result}}</p>
        </div>
    </div>

      {%endif%}
    <div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
